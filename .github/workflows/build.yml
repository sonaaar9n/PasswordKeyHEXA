name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # theme.zip repo me ho to usko unzip karke files apni jagah daal do (purani replace, nayi add)
      - name: Apply theme.zip
        run: |
          if [ -f theme.zip ]; then
            unzip -o theme.zip
            echo "theme.zip applied"
          else
            echo "theme.zip nahi mila, skip"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Add app icon
        run: |
          mkdir -p app/src/main/res/drawable
          cp icon.png app/src/main/res/drawable/ic_launcher.png

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PasswordKey-APK
          path: app/build/outputs/apk/debug/app-debug.apk
